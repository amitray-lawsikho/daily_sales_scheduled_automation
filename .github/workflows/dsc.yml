name: Daily Sales Check

# Scheduled by daily-reports.yml (around 12:00 IST on working days, after both dashboards have
# refreshed). Run by hand with "Run workflow" (blank date = yesterday). No Claude / LLM call in runs.
on:
  workflow_call:
    inputs:
      date: {type: string, default: ""}
  workflow_dispatch:
    inputs:
      date:
        description: "Last day of data YYYY-MM-DD (blank = the scheduled rule: yesterday, working days only)"
        default: ""
      teams:
        description: "One-off for other teams: team names separated by ; (blank = Amit's teams from config/dsc.json)"
        default: ""
      label:
        description: "One-off: name used in the file names and title, e.g. Team Darshan"
        default: ""
      drive_subfolder:
        description: "One-off: Drive subfolder for the files (blank = Daily Sales Check)"
        default: ""

concurrency:
  group: dsc
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gate (working day?)
        id: gate
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "date=${{ inputs.date }}" >> "$GITHUB_OUTPUT"
            echo "manual run for ${{ inputs.date }}"
          else
            python -m dsc.schedule
          fi

      - name: Install
        if: steps.gate.outputs.run == 'true'
        run: pip install -q -r requirements.txt

      - name: Tests
        if: steps.gate.outputs.run == 'true'
        run: python -m unittest discover -s tests -t .

      - name: Build and publish the Daily Sales Check
        if: steps.gate.outputs.run == 'true'
        run: python -m dsc run --date "${{ steps.gate.outputs.date }}" --publish
        env:
          DSC_TEAMS: ${{ inputs.teams }}
          DSC_LABEL: ${{ inputs.label }}
          DSC_DRIVE_SUBFOLDER: ${{ inputs.drive_subfolder }}
          REV_SUPABASE_KEY: ${{ secrets.REV_SUPABASE_KEY }}
          CALL_SUPABASE_KEY: ${{ secrets.CALL_SUPABASE_KEY }}
          LSQ_HOST: ${{ secrets.LSQ_HOST }}
          LSQ_ACCESS_KEY: ${{ secrets.LSQ_ACCESS_KEY }}
          LSQ_SECRET_KEY: ${{ secrets.LSQ_SECRET_KEY }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

      - name: Keep the PDF and xlsx for 14 days
        if: steps.gate.outputs.run == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-sales-check-${{ steps.gate.outputs.date }}
          path: output/dsc/
          retention-days: 14
