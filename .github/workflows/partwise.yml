name: Part Wise Connectivity

# 12:00 IST every day; the gate step stops in seconds unless today is a working day in
# config/months/<month>.json (or the 1st, to close the previous month). No Claude / LLM call in runs.
on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      month:
        description: "Month YYYY-MM (blank = the scheduled rule for today)"
        default: ""
      till:
        description: "Last day to include (needed with month)"
        default: ""
      write_history:
        description: "Freeze the month into history/ (auto = only when till is the last day)"
        type: choice
        options: [auto, "yes", "no"]
        default: auto

concurrency:
  group: partwise
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gate (working day?)
        id: gate
        run: |
          if [ -n "${{ inputs.month }}" ]; then
            if [ -z "${{ inputs.till }}" ]; then echo "till is required with month"; exit 1; fi
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "month=${{ inputs.month }}" >> "$GITHUB_OUTPUT"
            echo "till=${{ inputs.till }}" >> "$GITHUB_OUTPUT"
            echo "manual run: ${{ inputs.month }} till ${{ inputs.till }}"
          else
            python -m partwise.schedule
          fi

      - name: Install
        if: steps.gate.outputs.run == 'true'
        run: pip install -q -r requirements.txt

      - name: Tests
        if: steps.gate.outputs.run == 'true'
        run: python -m unittest discover -s tests -t .

      - name: Build and publish the report
        if: steps.gate.outputs.run == 'true'
        run: >
          python -m partwise run --month "${{ steps.gate.outputs.month }}" --till "${{ steps.gate.outputs.till }}"
          --publish --write-history "${{ inputs.write_history || 'auto' }}"
        env:
          CALL_SUPABASE_KEY: ${{ secrets.CALL_SUPABASE_KEY }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

      - name: Commit month history
        if: steps.gate.outputs.run == 'true'
        run: |
          if [ -n "$(git status --porcelain history/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add history/
            git commit -m "history: freeze ${{ steps.gate.outputs.month }} calls and stage changes"
            git push
          else
            echo "no history change"
          fi

      - name: Keep the xlsx for 14 days
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: partwise-${{ steps.gate.outputs.month }}-1-${{ steps.gate.outputs.till }}
          path: output/*.xlsx
          retention-days: 14
