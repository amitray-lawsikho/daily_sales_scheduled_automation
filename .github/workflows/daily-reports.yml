name: Daily reports (12:00 IST)

# Started every day at 11:40 IST by Supabase pg_cron job 'daily-reports-1140' in Calling Analytics
# (function _dispatch_daily_reports, Vault secret github_token). GitHub's own cron skipped 6 Nov 2026,
# so it is not used. "Run workflow" still works by hand.
#   1. gate     - stop in seconds unless a report is due today (working day, or Part Wise's month close)
#   2. refresh  - make sure the Revenue and Calling dashboards have refreshed after 11:30 IST (the revenue
#                 sheet is complete about 11:30); start a refresh if needed and wait for it
#   3. Part Wise Connectivity and the Daily Sales Check, side by side, on the fresh data
# No Claude / LLM call in runs.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      any: ${{ steps.g.outputs.any }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: g
        run: |
          a=$(python -m partwise.schedule | grep -c "run=true" || true)
          b=$(python -m dsc.schedule | grep -c "run=true" || true)
          if [ "$a$b" != "00" ]; then echo "any=true" >> "$GITHUB_OUTPUT"; else echo "any=false" >> "$GITHUB_OUTPUT"; fi
          echo "partwise=$a dsc=$b"

  refresh:
    needs: gate
    if: needs.gate.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - name: Refresh both dashboards and wait
        run: python -m dsc.refresh
        env:
          REV_SUPABASE_KEY: ${{ secrets.REV_SUPABASE_KEY }}
          CALL_SUPABASE_KEY: ${{ secrets.CALL_SUPABASE_KEY }}

  partwise:
    needs: [gate, refresh]
    if: ${{ !cancelled() && needs.gate.outputs.any == 'true' }}
    uses: ./.github/workflows/partwise.yml
    secrets: inherit

  daily-sales-check:
    needs: [gate, refresh]
    if: ${{ !cancelled() && needs.gate.outputs.any == 'true' }}
    uses: ./.github/workflows/dsc.yml
    secrets: inherit
